[project]
name = "mlx-lora-finetuner-backend"
version = "0.2.0"
description = "MLX ile LoRA fine-tuning yapan uygulamanın FastAPI backend'i"
requires-python = ">=3.11"
# Bounds policy: lower bound = the minor we develop/lock against, upper
# bound = the next major, so a `uv lock` refresh fails loudly instead of
# silently pulling a breaking major (the mlx extra stays pinned exactly).
dependencies = [
    "fastapi>=0.139.2,<1",
    "uvicorn[standard]>=0.51,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "aiosqlite>=0.22,<1",
    "huggingface_hub>=1.24.0,<2",
    "psutil>=7.2,<8",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.32,<1",
    "pypdf>=6.14,<7",
    "python-docx>=1.2,<2",
    "datasets>=5.0,<6",
    "pyyaml>=6.0,<7",
]

[project.scripts]
mlxlf = "app.cli:main"

[project.optional-dependencies]
mlx = [
    "mlx-lm-lora==3.0.0",
    "mlx-lm==0.31.3",
]
# Dependencies of llama.cpp's `convert_hf_to_gguf.py`, which GGUF export runs
# with this interpreter. Optional because torch is a large download and no
# other part of the app touches it — everything else runs on MLX.
gguf = [
    "torch>=2.13,<3",
    "transformers>=5.13,<6",
    "gguf>=0.19,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    # Linters are the exception to the bounds policy above: a new ruff MINOR
    # enables new default rules, which is effectively breaking for `make lint`.
    # 0.16 alone flags 96 findings here (32 are B008 on FastAPI's own Depends()
    # idiom), so the ceiling is the next minor, not the next major. Dependabot
    # still proposes the bump — as a PR we can review rules for, instead of an
    # incidental `uv lock` refresh silently breaking lint for everyone.
    "ruff>=0.15.21,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
